name: Animated-Flower-Build-and-Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sass
        run: npm install -g sass

      - name: Create dist directory
        run: mkdir -p application-code/animated-flower/dist

      - name: Compile SCSS to CSS
        run: sass application-code/animated-flower/src/style.scss application-code/animated-flower/dist/style.css

      - name: Copy HTML and JS files
        run: |
          cp application-code/animated-flower/src/index.html application-code/animated-flower/dist/index.html
          cp application-code/animated-flower/src/script.js application-code/animated-flower/dist/script.js

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: animated-flower-dist
          path: application-code/animated-flower/dist/

