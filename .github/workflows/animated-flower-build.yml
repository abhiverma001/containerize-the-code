name: Animated-Flower-Build-and-Deploy

on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sass
        run: npm install -g sass

      - name: Create dist directory
        run: mkdir -p application-code/animated-flower/dist

      - name: Compile SCSS to CSS
        run: sass application-code/animated-flower/src/style.scss application-code/animated-flower/dist/style.css

      - name: Copy HTML and JS files
        run: |
          cp application-code/animated-flower/src/index.html application-code/animated-flower/dist/index.html
          cp application-code/animated-flower/src/script.js application-code/animated-flower/dist/script.js

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: animated-flower-dist
          path: application-code/animated-flower/dist/


  dockerize:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: animated-flower-dist
          path: dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (optional)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            your-dockerhub-username/animated-flower:latest
            your-dockerhub-username/animated-flower:${{ github.sha }}
